<style>
  /* ── Theme tokens. Dark is the default; [data-theme="light"] overrides. ── */
  :root {
    --theme-dur: 240ms;      /* UI colour changes */
    --bg-dur: 850ms;         /* backdrop cross-fade between modes */
    --zoommer: #ff5000;      /* official Zoommer orange (brand logo SVG) */
    --fg: #ecedf0;
    --muted: rgba(236, 237, 240, 0.55);
    --panel: rgba(30, 32, 37, 0.58);
    --line: rgba(255, 255, 255, 0.09);
    --accent: #8fb0ff;
    /* Shared glass material (control bar + theme switch) */
    --glass-bg: rgba(26, 28, 33, 0.52);
    --glass-border: rgba(255, 255, 255, 0.13);
    --glass-filter: blur(20px) saturate(150%);
    --glass-shadow: 0 12px 36px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    --ctl-icon: rgba(236, 237, 240, 0.62);
    --ctl-icon-hover: #f4f5f7;
    --ctl-hover-bg: rgba(255, 255, 255, 0.08);
    --ctl-active-bg: #eceef2;
    --ctl-active-icon: #15171c;
    --ctl-active-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    --sep: rgba(255, 255, 255, 0.16);
    /* Zoom slider */
    --track: rgba(255, 255, 255, 0.12);
    --tick: rgba(255, 255, 255, 0.2);
    --tick-zero: rgba(255, 255, 255, 0.55);
    --num: rgba(255, 255, 255, 0.035);
    --num-active: rgba(255, 255, 255, 0.06);
    --swatch-border: rgba(255, 255, 255, 0.25);
    --ring-gap: #121316;
    --ring: rgba(255, 255, 255, 0.85);
    --spinner: rgba(255, 255, 255, 0.85);
    --spinner-track: rgba(255, 255, 255, 0.14);
    --page-bg:
      radial-gradient(60% 45% at 50% 42%, rgba(120, 130, 155, 0.16) 0%, rgba(0, 0, 0, 0) 70%),
      radial-gradient(130% 95% at 50% 40%, #2a2c31 0%, #18191c 50%, #0b0c0e 100%);
    --page-bg-light:
      radial-gradient(60% 45% at 50% 42%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 70%),
      radial-gradient(130% 95% at 50% 40%, #f5f6f8 0%, #e5e7eb 55%, #d3d6dc 100%);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --fg: #1b1d22;
    --muted: rgba(27, 29, 34, 0.55);
    --panel: rgba(255, 255, 255, 0.5);
    --line: rgba(20, 22, 28, 0.08);
    --accent: #3d6bff;
    --glass-bg: rgba(255, 255, 255, 0.5);
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-shadow: 0 12px 36px rgba(28, 34, 48, 0.16), 0 0 0 0.5px rgba(20, 22, 28, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    --ctl-icon: rgba(28, 30, 36, 0.58);
    --ctl-icon-hover: #14161b;
    --ctl-hover-bg: rgba(20, 22, 28, 0.06);
    --ctl-active-bg: #ffffff;
    --ctl-active-icon: #15171c;
    --ctl-active-shadow: 0 2px 10px rgba(28, 34, 48, 0.18);
    --sep: rgba(20, 22, 28, 0.12);
    --track: rgba(20, 22, 28, 0.1);
    --tick: rgba(20, 22, 28, 0.22);
    --tick-zero: rgba(20, 22, 28, 0.6);
    --num: rgba(20, 22, 28, 0.045);
    --num-active: rgba(20, 22, 28, 0.07);
    --swatch-border: rgba(20, 22, 28, 0.18);
    --ring-gap: #eceef1;
    --ring: rgba(20, 22, 28, 0.7);
    --spinner: rgba(20, 22, 28, 0.75);
    --spinner-track: rgba(20, 22, 28, 0.12);
    color-scheme: light;
  }
  :root[data-theme="zoommer"] {
    --fg: #ffffff;
    --muted: rgba(255, 255, 255, 0.8);
    --panel: rgba(112, 34, 0, 0.24);
    --line: rgba(255, 255, 255, 0.2);
    --accent: #ffffff;
    --glass-bg: rgba(96, 28, 0, 0.34);
    --glass-border: rgba(255, 255, 255, 0.3);
    --glass-shadow: 0 14px 40px rgba(96, 26, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    --ctl-icon: rgba(255, 255, 255, 0.9);
    --ctl-icon-hover: #ffffff;
    --ctl-hover-bg: rgba(255, 255, 255, 0.14);
    --ctl-active-bg: #ffffff;
    --ctl-active-icon: #1c1d21;
    --ctl-active-shadow: 0 3px 12px rgba(110, 30, 0, 0.3);
    --sep: rgba(255, 255, 255, 0.32);
    --track: rgba(255, 255, 255, 0.26);
    --tick: rgba(255, 255, 255, 0.45);
    --tick-zero: #ffffff;
    --num: rgba(255, 255, 255, 0.07);
    --num-active: rgba(255, 255, 255, 0.11);
    --swatch-border: rgba(255, 255, 255, 0.55);
    --ring-gap: #ff5a12;
    --ring: #ffffff;
    --spinner: #ffffff;
    --spinner-track: rgba(255, 255, 255, 0.3);
    color-scheme: dark;
  }
  /* On orange the slider's orange fill would vanish — switch it to white. */
  :root[data-theme="zoommer"] .zoom { --accent-a: #ffffff; --accent-b: #ffe6d6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    color: var(--fg);
    background: var(--page-bg);
    background-color: #121316;
    font-family: "Noto Sans Georgian", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    transition: color var(--theme-dur) ease;
  }
  /* Mode backdrops cross-fade over the dark base (gradients themselves can't be transitioned). */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: var(--page-bg-light);
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
  }
  :root[data-theme="light"] body::before { opacity: 1; }

  /* Zoommer studio: orange cyclorama — deep edges, soft centre light, broad overhead beam,
     lit floor and a light haze. Pure gradients (no filters) so it stays cheap on phones. */
  .zenv {
    position: fixed; inset: -3%; z-index: -1;
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
    overflow: hidden;
  }
  :root[data-theme="zoommer"] .zenv { opacity: 1; }

  /* Zoommer brand typography: a flat white HTML/SVG layer *behind* the transparent WebGL canvas.
     The phone therefore always covers it, can never intersect it in 3D, and it never moves with the model.
     Sizes / positions are set in px by layoutBrand() on resize only. */
  .ztype {
    position: fixed; inset: 0; z-index: -1;
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
    color: #ffffff;
    contain: strict;
  }
  :root[data-theme="zoommer"] .ztype { opacity: 1; }
  .ztype > * { position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%); }
  .zt-line {
    display: flex; align-items: center;
    white-space: nowrap;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1;
    font-size: 100px;
  }
  .zt-pro, .zt-word { display: block; fill: #ffffff; overflow: visible; }
  /* When the big words pass behind the zoom slider (narrow screens), back it with the bar's glass. */
  .zoom::before {
    content: ""; position: absolute; inset: 6px -6px; z-index: -1;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-filter);
    -webkit-backdrop-filter: var(--glass-filter);
    box-shadow: var(--glass-shadow);
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
  }
  :root[data-theme="zoommer"].zt-under-slider .zoom::before { opacity: 1; }
  .zenv > i { position: absolute; display: block; }
  .zenv .z-base {
    inset: 0;
    background: radial-gradient(120% 95% at 50% 40%, #ff8538 0%, #ff5000 36%, #d84300 66%, #8c2900 100%);
  }
  .zenv .z-glow {
    inset: 0;
    background: radial-gradient(44% 40% at 50% 40%, rgba(255, 200, 156, 0.55) 0%, rgba(255, 164, 104, 0.18) 45%, rgba(255, 120, 60, 0) 75%);
    transform: translate3d(calc(var(--px, 0) * 8px), calc(var(--py, 0) * 6px), 0);
  }
  .zenv .z-beam {
    left: 50%; top: -14%;
    width: 72vmax; height: 96vh; margin-left: -36vmax;
    background: radial-gradient(50% 100% at 50% 0%, rgba(255, 242, 230, 0.34) 0%, rgba(255, 226, 202, 0.12) 42%, rgba(255, 210, 180, 0) 72%);
    transform: translate3d(calc(var(--px, 0) * 20px), calc(var(--py, 0) * 10px), 0);
  }
  .zenv .z-floor {
    left: -8%; right: -8%; bottom: 0; height: 48%;
    background:
      radial-gradient(60% 40% at 50% 44%, rgba(255, 216, 184, 0.46) 0%, rgba(255, 172, 122, 0.16) 46%, rgba(255, 120, 60, 0) 76%),
      linear-gradient(180deg, rgba(255, 120, 50, 0) 0%, rgba(118, 32, 0, 0.3) 100%);
    transform: translate3d(calc(var(--px, 0) * -14px), calc(var(--py, 0) * -5px), 0);
  }
  .zenv .z-fog {
    inset: 0;
    background: radial-gradient(85% 55% at 50% 64%, rgba(255, 234, 216, 0.16) 0%, rgba(255, 234, 216, 0) 70%);
    transform: translate3d(calc(var(--px, 0) * 5px), 0, 0);
  }
  /* Same glass material for every floating control surface. */
  .glass {
    height: 56px;
    padding: 8px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-filter);
    -webkit-backdrop-filter: var(--glass-filter);
    box-shadow: var(--glass-shadow);
    transition: background-color var(--theme-dur) ease, border-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
  }
  #c {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
    outline: none;
  }
  #c.dragging { cursor: grabbing; }

  header {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    left: max(22px, env(safe-area-inset-left));
    pointer-events: none;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  header p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  .swatches {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: max(22px, env(safe-area-inset-right));
    display: flex; gap: 10px; padding: 7px 9px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
  }
  .swatches button {
    width: 20px; height: 20px; padding: 0;
    border-radius: 50%;
    border: 1px solid var(--swatch-border);
    background: var(--sw);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .swatches button:hover { transform: scale(1.1); }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ring-gap), 0 0 0 3.5px var(--ring); }

  /* ── Control bar: glass capsule, one row of 40 × 40 icon buttons ── */
  .dock {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    width: max-content;
    max-width: calc(100vw - 24px);
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    touch-action: pan-x;
  }
  .dock::-webkit-scrollbar { display: none; }
  .dock .group { position: relative; display: flex; align-items: center; gap: 6px; flex: none; }
  .dock button {
    position: relative; z-index: 1;
    flex: none;
    display: grid; place-items: center;
    width: 40px; height: 40px; padding: 0;
    appearance: none;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ctl-icon);
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  .dock button svg {
    width: 21px; height: 21px;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  .dock button:hover { color: var(--ctl-icon-hover); background: var(--ctl-hover-bg); }
  .dock button:active { transform: scale(0.94); }
  /* Selected state: light pill, dark icon */
  .dock button.active,
  .dock button[aria-pressed="true"] { color: var(--ctl-active-icon); background: transparent; }
  .dock button.active:hover { color: var(--ctl-active-icon); background: transparent; }
  .dock #auto[aria-pressed="true"],
  .dock #auto[aria-pressed="true"]:hover { color: var(--ctl-active-icon); background: var(--ctl-active-bg); box-shadow: var(--ctl-active-shadow); }
  /* Segmented control: one light indicator slides between the mutually exclusive views */
  .dock .seg-ind {
    position: absolute; left: 0; top: 0; z-index: 0;
    width: 40px; height: 40px;
    border-radius: 999px;
    background: var(--ctl-active-bg);
    box-shadow: var(--ctl-active-shadow);
    opacity: 0;
    transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.2, 1), opacity 0.18s ease, background-color var(--theme-dur) ease;
    pointer-events: none;
  }
  .dock .seg-ind.show { opacity: 1; }
  .dock .sep { flex: none; width: 1px; height: 24px; margin: 0 2px; background: var(--sep); }

  /* ── Theme switch: Light / Dark / Zoommer. Same glass capsule as the bar (shared .glass);
        three equal 40 px slots and one 40 px knob sliding between them. 136 = 2 × (1 border + 7) + 3 × 40 ── */
  .theme-toggle {
    position: fixed; z-index: 5; left: 0; top: 0;
    display: flex; align-items: center;
    width: 136px;
    padding: 7px;                  /* + 1 px border = 8 px from the outer edge, like the bar */
    visibility: hidden;            /* shown once JS has measured where it goes */
  }
  .theme-toggle.placed { visibility: visible; }
  .theme-toggle .tt-knob {
    position: absolute; left: 7px; top: 7px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--ctl-active-bg);
    box-shadow: var(--ctl-active-shadow);
    transform: translateX(calc(var(--i, 1) * 40px));
    transition: transform 260ms cubic-bezier(0.3, 0.7, 0.2, 1), background-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
    pointer-events: none;
  }
  .theme-toggle button,
  .share button {
    position: relative; z-index: 1;
    flex: none;
    display: grid; place-items: center;
    width: 40px; height: 40px; padding: 0; margin: 0;
    appearance: none; border: 0; border-radius: 50%;
    background: transparent;
    color: var(--ctl-icon);
    cursor: pointer;
    touch-action: manipulation;
    transition: color 0.2s ease, background-color 0.18s ease, transform 0.18s ease;
  }
  .theme-toggle button:hover,
  .share button:hover { color: var(--ctl-icon-hover); background: var(--ctl-hover-bg); }
  .theme-toggle button[aria-checked="true"],
  .theme-toggle button[aria-checked="true"]:hover { color: var(--ctl-active-icon); background: transparent; }
  .theme-toggle button:active,
  .share-main button:active { transform: scale(0.92); }
  .theme-toggle button:focus-visible,
  .share button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .theme-toggle svg,
  .share svg {
    width: 20px; height: 20px;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  /* The filled, circular emblem reads heavier than line icons — 19 px matches their visual weight. */
  .theme-toggle svg.zm { width: 19px; height: 19px; fill: currentColor; stroke: none; }
  @media (prefers-reduced-motion: reduce) {
    .theme-toggle .tt-knob { transition-duration: 0.01ms; }
    .zenv, .ztype, body::before { transition-duration: 200ms; }
  }

  /* ── Share: 56 × 56 glass button, left edge, vertically centred; menu capsule slides out to its right ── */
  .share {
    position: fixed; z-index: 6;
    left: calc(24px + env(safe-area-inset-left));
    top: 50%;
    width: 56px; height: 56px;
    /* Whole control (button, menu, gaps) drawn at 90 %: 56 → 50.4 px, 40 → 36 px.
       Scaling from the left-centre keeps its left edge and vertical centre in place. */
    transform: translateY(-50%) scale(0.9);
    transform-origin: 0 50%;
  }
  .share-main {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    width: 56px;
    padding: 7px;                                   /* + 1 px border = 8 px */
  }
  .share-main svg { position: absolute; transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .share-main .i-close { opacity: 0; transform: rotate(-90deg) scale(0.6); }
  .share.open .share-main .i-share { opacity: 0; transform: rotate(90deg) scale(0.6); }
  .share.open .share-main .i-close { opacity: 1; transform: none; }
  /* The main button sits alone in its glass circle: no inner hover disc, just a brighter icon. */
  .share .share-main button:hover,
  .share.open .share-main button { color: var(--ctl-icon-hover); background: transparent; }

  .share-menu {
    position: absolute; z-index: 1; left: 64px; top: 0;       /* 56 px button + 8 px gap */
    display: flex; align-items: center; gap: 6px;
    width: max-content;
    padding: 7px;
    transform-origin: left center;
    opacity: 0;
    transform: translateX(-12px) scale(0.92);
    visibility: hidden;
    /* closing: quicker, no overshoot */
    transition: opacity 200ms ease, transform 230ms cubic-bezier(0.4, 0, 0.7, 0.2), visibility 0s linear 230ms,
      background-color var(--theme-dur) ease, border-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
  }
  .share.open .share-menu {
    opacity: 1; transform: none; visibility: visible;
    /* opening: ~330 ms with a light spring */
    transition: opacity 220ms ease, transform 330ms cubic-bezier(0.34, 1.32, 0.64, 1), visibility 0s,
      background-color var(--theme-dur) ease, border-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
  }
  .share-menu button { opacity: 0; transform: translateX(-6px) scale(0.9); }
  .share.open .share-menu button {
    opacity: 1; transform: none;
    transition: opacity 220ms ease calc(60ms + var(--k, 0) * 40ms),
      transform 300ms cubic-bezier(0.34, 1.32, 0.64, 1) calc(60ms + var(--k, 0) * 40ms),
      color 0.2s ease, background-color 0.18s ease;
  }
  .share.open .share-menu button:active { transform: scale(0.92); transition-delay: 0s; }
  .share-menu button[hidden] { display: none; }
  .share-menu button svg { position: absolute; transition: opacity 0.18s ease, transform 0.22s ease; }
  .share-menu button .i-check { opacity: 0; transform: scale(0.6); }
  .share-menu button.done .i-main { opacity: 0; transform: scale(0.6); }
  .share-menu button.done .i-check { opacity: 1; transform: none; }
  .share svg .dot { fill: currentColor; stroke: none; }

  /* Not enough width (very narrow phones): stack the actions vertically next to the button. */
  .share.vertical .share-menu { left: 0; top: 64px; flex-direction: column; transform-origin: top center; transform: translateY(-12px) scale(0.92); }
  .share.vertical.up .share-menu { top: auto; bottom: 64px; transform-origin: bottom center; transform: translateY(12px) scale(0.92); }
  .share.vertical.open .share-menu { transform: none; }
  .share.vertical .share-menu button { transform: translateY(-6px) scale(0.9); }
  .share.vertical.open .share-menu button { transform: none; }

  .share-toast {
    position: absolute; left: 64px; top: 66px;
    height: auto; padding: 8px 14px;
    font-size: 12.5px; line-height: 1.2; white-space: nowrap;
    color: var(--fg);
    opacity: 0; transform: translateY(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .share-toast.show { opacity: 1; transform: none; }
  .share.vertical .share-toast { top: 4px; }

  @media (max-width: 640px) {
    .share { left: calc(14px + env(safe-area-inset-left)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .share-menu, .share.open .share-menu, .share-menu button, .share.open .share-menu button,
    .share.vertical .share-menu, .share.vertical .share-menu button {
      transform: none !important;
      transition: opacity 120ms ease, visibility 0s linear 120ms !important;
    }
    .share.open .share-menu { transition: opacity 120ms ease !important; }
    .share-main svg { transition: opacity 120ms ease; transform: none !important; }
  }
  :root.theme-stacked .hint { bottom: calc(160px + env(safe-area-inset-bottom)); }

<script>
  // Shared error display + WebGL 2 capability check (runs before the 3D module).
  window.__showError = function (title, msg) {
    var loader = document.getElementById('loader');
    if (loader) loader.style.display = 'none';
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error').hidden = false;
  };
  (function () {
    var ok = false;
    try {
      var c = document.createElement('canvas');
      var gl = window.WebGL2RenderingContext && c.getContext('webgl2');
      ok = !!gl;
      if (gl) { var ext = gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); }
    } catch (e) { ok = false; }
    window.__WEBGL_OK__ = ok;
    if (!ok) {
      window.__showError(
        'WebGL ხელმისაწვდომი არ არის',
        'თქვენი ბრაუზერი ან მოწყობილობა 3D გრაფიკას (WebGL 2) არ უჭერს მხარს, ან ის გამორთულია. გამოიყენეთ Chrome, Edge, Firefox ან Safari-ს განახლებული ვერსია და ჩართეთ აპარატურული აჩქარება (hardware acceleration).'
      );
    }
    // If the library never arrives (offline / blocked CDN), tell the user instead of spinning forever.
    window.__loadTimer = setTimeout(function () {
      if (!window.__LIB_LOADED__ && window.__WEBGL_OK__) {
        window.__showError('ჩატვირთვა ვერ დასრულდა', 'Three.js ბიბლიოთეკა CDN-დან იტვირთება. შეამოწმეთ ინტერნეტ-კავშირი და განაახლეთ გვერდი.');
      }
    }, 25000);
  })();
</script>

<script type="module">
const loaderEl = document.getElementById('loader');
const loaderText = document.getElementById('loader-text');
// Let the loader repaint between build steps (setTimeout fallback keeps going in background tabs).
const step = (t) => { loaderText.textContent = t; return new Promise(r => { requestAnimationFrame(() => r()); setTimeout(r, 60); }); };

if (window.__WEBGL_OK__) {
  main().catch((err) => {
    console.error(err);
    window.__showError('დაფიქსირდა შეცდომა', 'სცენის აგება ვერ მოხერხდა: ' + (err && err.message ? err.message : err));
  });
}

async function main() {
  await step('ბიბლიოთეკის ჩატვირთვა…');
  let THREE, BGU;
  try {
    THREE = await import('three');
    BGU = await import('three/addons/utils/BufferGeometryUtils.js');
  } catch (e) {
    console.error(e);
    window.__showError('Three.js ვერ ჩაიტვირთა', 'ბიბლიოთეკა CDN-დან (cdn.jsdelivr.net) იტვირთება — შეამოწმეთ ინტერნეტ-კავშირი და განაახლეთ გვერდი.');
    return;
  }
  window.__LIB_LOADED__ = true;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ───────────────────────── Renderer / scene / camera ─────────────────────────
  const canvas = document.getElementById('c');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) {
    window.__showError('WebGL ხელმისაწვდომი არ არის', 'WebGL კონტექსტის შექმნა ვერ მოხერხდა. ჩართეთ აპარატურული აჩქარება ან სცადეთ სხვა ბრაუზერი.');
    return;
  }
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    window.__showError('WebGL კონტექსტი დაიკარგა', 'გრაფიკული დრაივერი გადაიტვირთა. განაახლეთ გვერდი.');
  });

  const maxPR = Math.min(window.devicePixelRatio || 1, 2);
  let pixelRatio = maxPR;
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.1;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28, window.innerWidth / window.innerHeight, 10, 5000);
  const LOOK_AT = new THREE.Vector3(0, -8, 0);

  // ───────────────────────── Dimensions (millimetres) ─────────────────────────
  // Master reference: DJI's official orthographic front (0.2685 mm/px) and rear (0.2495 mm/px) photos, scaled to the
  // published 144.2 mm height; depth from the two 3/4 photos. Everything except the height is a photo measurement.
  const H = 144.2;                          // overall height: handle bottom → camera head top
  const Y0 = -H / 2;                        // model is centred on its height; y = Y0 + mm above the bottom
  const HW = 33.0, HD = 22.0, HR = 4.5;     // handle width, depth (estimate), vertical-edge radius
  const FZ = HD / 2;                        // handle front face (screen side, +z)
  const BR = 6.5;                           // bottom edge rounding
  const SHOULDER = 89.4, SHOULDER_H = 8.6;  // handle top narrows (x only) into the pan-motor collar
  const COLLAR_R = 11.15, COLLAR_TOP = 107.1;
  const HEAD_Y = Y0 + 131.3, HEAD_Z = 3.0;  // camera head (tilt axis / lens) centre
  const DW = 24.9, DH = 44.3;               // display active area, 2.0″ 16:9 (portrait)
  const EXT = { x: 17.9, zMin: -14.8, zMax: 15.2 };   // overall extents (floor shadow)

  // ───────────────────────── Geometry helpers ─────────────────────────
  function rrect4(w, h, tl, tr, br, bl) {
    const m = Math.min(w, h) / 2 - 1e-3;
    tl = Math.min(tl, m); tr = Math.min(tr, m); br = Math.min(br, m); bl = Math.min(bl, m);
    const x0 = -w / 2, x1 = w / 2, y0 = -h / 2, y1 = h / 2;
    const s = new THREE.Shape();
    s.moveTo(x0 + bl, y0);
    s.lineTo(x1 - br, y0);
    s.absarc(x1 - br, y0 + br, br, -Math.PI / 2, 0, false);
    s.lineTo(x1, y1 - tr);
    s.absarc(x1 - tr, y1 - tr, tr, 0, Math.PI / 2, false);
    s.lineTo(x0 + tl, y1);
    s.absarc(x0 + tl, y1 - tl, tl, Math.PI / 2, Math.PI, false);
    s.lineTo(x0, y0 + bl);
    s.absarc(x0 + bl, y0 + bl, bl, Math.PI, Math.PI * 1.5, false);
    return s;
  }
  const rrect = (w, h, r) => rrect4(w, h, r, r, r, r);

  // Rounded slab with soft (quarter-round) edges. Spans z ∈ [0, thick]; outer footprint is exactly w × h.
  function slab(w, h, radii, thick, bs, bt, curveSegments = 12, bevelSegments = 6) {
    const r = Array.isArray(radii) ? radii : [radii, radii, radii, radii];
    const shape = rrect4(w - 2 * bs, h - 2 * bs, ...r.map(v => Math.max(v - bs, 0.02)));
    const g = new THREE.ExtrudeGeometry(shape, {
      depth: Math.max(thick - 2 * bt, 0.001),
      bevelEnabled: true, bevelThickness: bt, bevelSize: bs,
      bevelSegments, curveSegments
    });
    g.translate(0, 0, bt);
    g.deleteAttribute('uv');
    return BGU.toCreasedNormals(g, Math.PI / 3);
  }

  function lathe(points, segments = 96) {
    const g = new THREE.LatheGeometry(points.map(p => new THREE.Vector2(p[0], p[1])), segments);
    g.rotateX(Math.PI / 2); // lathe axis Y → local Z
    return g;
  }

  // Spherical cap with base radius `a` and height `h`; base at z = 0, apex at z = h.
  function cap(a, h, seg = 64) {
    const s = (a * a + h * h) / (2 * h);
    const g = new THREE.SphereGeometry(s, seg, 14, 0, Math.PI * 2, 0, Math.asin(a / s));
    g.translate(0, h - s, 0);
    g.rotateX(Math.PI / 2);
    return g;
  }

  function flatShape(shape, segs = 24) { return new THREE.ShapeGeometry(shape, segs); }

  // Point where a ray from the centre (direction c, s) meets a rounded rectangle (half-sizes a, b; corner radius r).
  function rrectRay(a, b, r, c, s) {
    r = Math.min(r, a, b);
    const ac = Math.abs(c), as = Math.abs(s);
    let t = Math.min(ac > 1e-9 ? a / ac : Infinity, as > 1e-9 ? b / as : Infinity);
    const cx = a - r, cy = b - r;
    if (t * ac > cx && t * as > cy) {
      const B = cx * ac + cy * as, C = cx * cx + cy * cy - r * r;
      t = B + Math.sqrt(Math.max(B * B - C, 0));
    }
    return [t * c, t * s];
  }

  // Lofted solid: rounded-rectangle rings [y, halfWidth, halfDepth, cornerRadius] stacked upwards.
  // Every ring has the same vertex count, so a rectangle can blend smoothly into a circle (r = a = b).
  // The lowest ring is closed with a centre vertex; the top stays open (it is hidden by the collar).
  function loft(rings, M = 160) {
    const pos = [], idx = [];
    for (const [y, a, b, r] of rings) {
      for (let i = 0; i < M; i++) {
        const t = (i / M) * Math.PI * 2;
        const [x, z] = rrectRay(a, b, r, Math.cos(t), Math.sin(t));
        pos.push(x, y, z);
      }
    }
    for (let k = 0; k < rings.length - 1; k++) for (let i = 0; i < M; i++) {
      const a = k * M + i, b = k * M + (i + 1) % M;
      idx.push(a, a + M, b, b, a + M, b + M);
    }
    const ci = pos.length / 3;
    pos.push(0, rings[0][0], 0);
    for (let i = 0; i < M; i++) idx.push(ci, i, (i + 1) % M);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  // Planar UVs in millimetres / tile size (for tiling normal maps on flat panels).
  function planarUV(g, tu, tv) {
    const p = g.attributes.position, uv = [];
    for (let i = 0; i < p.count; i++) uv.push(p.getX(i) / tu, p.getY(i) / tv);
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    return g;
  }

  // Polygon with rounded corners (convex or concave), corners as [x, y, radius].
  function roundedPoly(pts) {
    const s = new THREE.Shape(), n = pts.length;
    const along = (p, q, d) => { const l = Math.hypot(q[0] - p[0], q[1] - p[1]); return [p[0] + (q[0] - p[0]) * d / l, p[1] + (q[1] - p[1]) * d / l]; };
    for (let i = 0; i < n; i++) {
      const p = pts[i], prev = pts[(i + n - 1) % n], next = pts[(i + 1) % n];
      const a = along(p, prev, p[2]), b = along(p, next, p[2]);
      if (i === 0) s.moveTo(a[0], a[1]); else s.lineTo(a[0], a[1]);
      s.quadraticCurveTo(p[0], p[1], b[0], b[1]);
    }
    s.closePath();
    return s;
  }

  // Absolute SVG path data (M / L / C / Z) → THREE shapes, y flipped to point up.
  function svgShapes(paths) {
    return paths.map((d) => {
      const s = new THREE.Shape();
      const t = d.match(/[MLCZ]|-?\d*\.?\d+(?:e-?\d+)?/gi);
      let i = 0, cmd = '';
      const P = () => { const x = parseFloat(t[i++]), y = parseFloat(t[i++]); return [x, -y]; };
      while (i < t.length) {
        if (/[MLCZ]/i.test(t[i])) { cmd = t[i++].toUpperCase(); if (cmd === 'Z') continue; }
        if (cmd === 'M') { s.moveTo(...P()); cmd = 'L'; }
        else if (cmd === 'L') s.lineTo(...P());
        else if (cmd === 'C') { const a = P(), b = P(), c = P(); s.bezierCurveTo(...a, ...b, ...c); }
        else i++;                                   // stray number after Z: skip it
      }
      return s;
    });
  }

  // Camera preview (portrait 9:16): a calm mountain-lake dusk scene with the restrained interface seen in the
  // reference photos — menu grid, side dots, photo glyph + "9:16", favourite heart. No invented readouts.
  function makeScreenTexture() {
    const cw = 640, ch = Math.round(cw * DH / DW);
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const x = c.getContext('2d');
    const mm = cw / DW;
    const hz = ch * 0.56;                                  // horizon / shoreline

    let g = x.createLinearGradient(0, 0, 0, hz);

    // Mountain: a single volcanic cone with a warm-lit right flank, smaller ridges either side.
    const peak = (cx, top, halfW, base) => {
      x.beginPath();
      x.moveTo(cx - halfW, base);
      x.bezierCurveTo(cx - halfW * 0.45, base - (base - top) * 0.35, cx - halfW * 0.12, top + (base - top) * 0.06, cx - halfW * 0.03, top);
      x.lineTo(cx + halfW * 0.03, top);
      x.bezierCurveTo(cx + halfW * 0.12, top + (base - top) * 0.06, cx + halfW * 0.45, base - (base - top) * 0.35, cx + halfW, base);
      x.closePath();
    };
    x.fillStyle = '#3b3f52';
    x.beginPath(); x.moveTo(0, hz); x.lineTo(0, hz - ch * 0.05); x.quadraticCurveTo(cw * 0.22, hz - ch * 0.08, cw * 0.4, hz - ch * 0.02); x.lineTo(cw, hz - ch * 0.035); x.lineTo(cw, hz); x.fill();
    peak(cw * 0.52, hz - ch * 0.27, cw * 0.62, hz);
    g = x.createLinearGradient(cw * 0.3, 0, cw * 0.8, 0);
    g.addColorStop(0, '#2c3042'); g.addColorStop(0.5, '#4a4552'); g.addColorStop(0.62, '#b0715a'); g.addColorStop(1, '#6e4c4c');

    x.strokeStyle = 'rgba(245,235,230,0.55)'; x.lineWidth = 2.2;
    for (let i = 0; i < 9; i++) {

      x.beginPath(); x.moveTo(sx, hz - ch * 0.265 + Math.abs(i - 4) * 4); x.lineTo(sx + (i - 4) * 9, hz - ch * 0.2 + (i % 3) * 6); x.stroke();
    }
    // dark shoreline band
    x.fillStyle = '#1b1d24';
    x.fillRect(0, hz - 3, cw, ch * 0.022);

    // Lake: mirrored scene, darkened, with soft horizontal ripples.
    x.save();
    x.translate(0, 2 * hz + ch * 0.022);
    x.scale(1, -1);
    x.globalAlpha = 0.72;
    x.drawImage(c, 0, 0, cw, hz, 0, 0, cw, hz);
    x.restore();
    g = x.createLinearGradient(0, hz, 0, ch);
    g.addColorStop(0, 'rgba(10,12,20,0.25)'); g.addColorStop(1, 'rgba(6,8,14,0.85)');
    x.fillStyle = g; x.fillRect(0, hz + ch * 0.02, cw, ch - hz);
    x.strokeStyle = 'rgba(255,230,210,0.07)'; x.lineWidth = 1.2;

    // Interface (white, ~94 %)
    x.fillStyle = 'rgba(255,255,255,0.94)';
    const q = 0.7 * mm, qg = 0.3 * mm, q0 = 1.4 * mm;
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      x.beginPath(); x.roundRect(q0 + i * (q + qg), q0 + j * (q + qg), q, q, 0.16 * mm); x.fill();
    }
    for (let i = 0; i < 3; i++) { x.beginPath(); x.arc(1.0 * mm, ch * 0.44 + i * 1.0 * mm, 0.28 * mm, 0, Math.PI * 2); x.fill(); }
    x.beginPath(); x.roundRect(cw - 0.8 * mm, ch * 0.4, 0.22 * mm, 3.2 * mm, 0.11 * mm); x.fill();
    const fy = ch - 1.6 * mm;
    // photo glyph
    const ix = 1.4 * mm, iw = 1.9 * mm, ih = 1.4 * mm;
    x.beginPath(); x.roundRect(ix, fy - ih / 2, iw, ih, 0.3 * mm); x.fill();
    x.fillStyle = '#20222a';
    x.beginPath(); x.arc(ix + iw / 2, fy, 0.42 * mm, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.94)';
    x.font = `600 ${(1.45 * mm).toFixed(1)}px "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, sans-serif`;
    x.textBaseline = 'middle'; x.textAlign = 'left';
    x.fillText('9:16', ix + iw + 0.6 * mm, fy);
    // heart outline
    const hx = cw - 2.4 * mm, hs = 0.85 * mm;
    x.strokeStyle = 'rgba(255,255,255,0.94)'; x.lineWidth = 0.18 * mm; x.lineJoin = 'round';
    x.beginPath();
    x.moveTo(hx, fy + hs * 0.8);
    x.bezierCurveTo(hx - hs * 1.6, fy - hs * 0.1, hx - hs * 0.9, fy - hs * 1.3, hx, fy - hs * 0.45);
    x.bezierCurveTo(hx + hs * 0.9, fy - hs * 1.3, hx + hs * 1.6, fy - hs * 0.1, hx, fy + hs * 0.8);
    x.stroke();

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  // Tangent-space normal map from a height function h(u, v) on a tile of tw × th mm (wraps seamlessly).
  function normalMapFromHeight(tw, th, pxPerMm, h, strength) {
    const W = Math.max(8, Math.round(tw * pxPerMm)), Hh = Math.max(8, Math.round(th * pxPerMm));
    const c = document.createElement('canvas');
    c.width = W; c.height = Hh;
    const x = c.getContext('2d');
    const img = x.createImageData(W, Hh);
    const du = tw / W, dv = th / Hh;
    for (let j = 0; j < Hh; j++) {
      const v = (1 - (j + 0.5) / Hh) * th;                  // canvas row 0 = top of the tile (flipY)
      for (let i = 0; i < W; i++) {
        const u = (i + 0.5) / W * tw;
        const hx = (h(u + du, v) - h(u - du, v)) / (2 * du);
        const hy = (h(u, v + dv) - h(u, v - dv)) / (2 * dv);
        let nx = -hx * strength, ny = -hy * strength, nz = 1;
        const l = Math.hypot(nx, ny, nz);
        const k = (j * W + i) * 4;
        img.data[k] = (nx / l * 0.5 + 0.5) * 255;
        img.data[k + 1] = (ny / l * 0.5 + 0.5) * 255;
        img.data[k + 2] = (nz / l * 0.5 + 0.5) * 255;
        img.data[k + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // Rear grip ribs: wide ridges with narrow grooves running "/" (seen from the back), ≈ 29° from horizontal,
  // 4.9 mm apart (5.6 mm vertical pitch, measured on the official rear photo).
  const RIB_SP = 4.9, RIB_ANG = THREE.MathUtils.degToRad(29);
  const RIB_TU = RIB_SP / Math.sin(RIB_ANG), RIB_TV = RIB_SP / Math.cos(RIB_ANG);
  function makeRibTexture() {
    const gw = 0.24;                                         // groove share of one period
    return normalMapFromHeight(RIB_TU, RIB_TV, 60, (u, v) => {
      const ph = ((v / RIB_TV - u / RIB_TU) % 1 + 1) % 1;
      return ph < gw ? -0.36 * Math.pow(Math.sin(Math.PI * ph / gw), 2) : 0.04 * Math.sin(Math.PI * (ph - gw) / (1 - gw));
    }, 1.0);
  }

  // Joystick cap: fine diamond knurl.
  function makeKnurlTexture() {
    const p = 0.62;
    return normalMapFromHeight(p, p, 160, (u, v) => {
      const a = Math.abs(((u + v) / p) % 1 - 0.5), b = Math.abs(((u - v + 8 * p) / p) % 1 - 0.5);
      return 0.12 * Math.min(a, b);
    }, 1.0);
  }

  // Flat print / engraving decals on a transparent canvas (w × h mm).
  function makeDecal(wmm, hmm, pxPerMm, draw) {

    t.colorSpace = THREE.SRGBColorSpace;

    return t;
  }

  {
    const PW = 29.7, y0 = 2.6, y1 = 89.0, R = 4.2, LIFT = 0.32, NX = 72;
    const pos = [], uv = [], idx = [];
    const col = (x) => {                                     // vertical extent of the rounded rectangle at x
      const e = Math.abs(x) - (PW / 2 - R);
      const cut = e > 0 ? R - Math.sqrt(Math.max(R * R - e * e, 0)) : 0;
      return [y0 + cut, y1 - cut];

    const surf = (x) => {                                    // shell point + outward normal at lateral offset x
      const e = Math.abs(x) - (HW / 2 - HR);
      if (e <= 0) return [0, [0, 0, 1]];
      const a = Math.asin(Math.min(e / HR, 1));
      return [-edgeDrop(x), [Math.sign(x) * Math.sin(a), 0, Math.cos(a)]];
    };
    for (let i = 0; i <= NX; i++) {
      const xx = -PW / 2 + (PW * i) / NX;
      const [ya, yb] = col(xx), [dz, n] = surf(xx);
      for (const yy of [ya, yb]) {
        pos.push(xx + n[0] * LIFT, at(yy), dz + n[2] * LIFT);
        uv.push(xx / RIB_TU, yy / RIB_TV);

    }
    for (let i = 0; i < NX; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    // skirt down to the shell all the way round, so the panel reads as a raised inlay
    const ring = [];
    for (let i = 0; i <= NX; i++) ring.push(i * 2);
    for (let i = NX; i >= 0; i--) ring.push(i * 2 + 1);
    const base = pos.length / 3;
    for (const k of ring) {
      const xx = pos[k * 3], [dz, n] = surf(xx);
      pos.push(pos[k * 3] - n[0] * (LIFT + 0.2), pos[k * 3 + 1], pos[k * 3 + 2] - n[2] * (LIFT + 0.2));

    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length], c = base + i, d = base + (i + 1) % ring.length;

  // ───────────────────────── Camera framing ─────────────────────────
  // Work area = the visible scene above the bottom controls (bar and, on narrow screens, the stacked theme switch).
  // On narrow screens the centred title stack would meet the top-left heading, so the area starts below it.
  const NARROW = 720;
  function workArea() {
    const dockTop = document.getElementById('dock').getBoundingClientRect().top;
    const th = document.getElementById('theme');
    const themeTop = th.classList.contains('placed') ? th.getBoundingClientRect().top : Infinity;

    return { top, bottom, height: bottom - top };

  // lookFactor shifts the aim point so that centre holds at every zoom distance.
  const PHONE_FILL = 0.9;
  let baseDist = 1, lookFactor = 0;
  function frameCamera() {
    const vh = window.innerHeight;
    const wa = workArea();
    const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
    let visH = H * vh / (PHONE_FILL * wa.height);              // world height visible at the phone

    if (visH * camera.aspect < minVisW) visH = minVisW / camera.aspect;
    baseDist = visH / 2 / tv;
    lookFactor = (vh - (wa.top + wa.bottom)) * tv / vh;
  }

    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;

    const txt = fmtLevel(v);
    zoomNum.textContent = txt;
    zoomHit.setAttribute('aria-valuenow', String(Math.round(v * 100) / 100));
    zoomHit.setAttribute('aria-valuetext', txt);
  }
  function setLevel(v) {
    v = clamp(v, -LEVEL_MAX, LEVEL_MAX);
    if (Math.abs(v) < 0.12) v = 0;                         // soft detent at the default
    state.tZoom = zoomFromLevel(Math.round(v * 20) / 20);   // 0.05 grid, so ¼-steps add up exactly
    renderZoomUI(levelFromZoom(state.tZoom));
    hideHint();
  }

  let zoomDrag = null;
  zoomHit.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    try { zoomHit.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
    const tr = zoomThumb.getBoundingClientRect();
    const onThumb = e.clientY >= tr.top && e.clientY <= tr.bottom;
    zoomDrag = { id: e.pointerId, offset: onThumb ? e.clientY - (tr.top + tr.height / 2) : 0 };
    zoomEl.classList.add('active');
    zoomHit.focus({ preventScroll: true });
    const r = zoomHit.getBoundingClientRect();
    setLevel(LEVEL_MAX - ((e.clientY - zoomDrag.offset - r.top) / r.height) * 2 * LEVEL_MAX);
  });
  zoomHit.addEventListener('pointermove', (e) => {
    if (!zoomDrag || e.pointerId !== zoomDrag.id) return;
    const r = zoomHit.getBoundingClientRect();
    setLevel(LEVEL_MAX - ((e.clientY - zoomDrag.offset - r.top) / r.height) * 2 * LEVEL_MAX);
  });
  const endZoomDrag = (e) => {
    if (!zoomDrag || e.pointerId !== zoomDrag.id) return;
    zoomDrag = null;
    zoomEl.classList.remove('active');
  };
  zoomHit.addEventListener('pointerup', endZoomDrag);
  zoomHit.addEventListener('pointercancel', endZoomDrag);
  zoomHit.addEventListener('lostpointercapture', endZoomDrag);
  zoomHit.addEventListener('dblclick', (e) => { e.stopPropagation(); setLevel(0); });
  zoomHit.addEventListener('wheel', (e) => {
    e.preventDefault();
    setLevel(levelFromZoom(state.tZoom) - Math.sign(e.deltaY) * 0.25);
  }, { passive: false });
  zoomHit.addEventListener('keydown', (e) => {
    const cur = levelFromZoom(state.tZoom);
    const map = { ArrowUp: 0.25, ArrowRight: 0.25, ArrowDown: -0.25, ArrowLeft: -0.25, PageUp: 1, PageDown: -1 };
    let next = null;
    if (e.key in map) next = cur + map[e.key];
    else if (e.key === 'Home') next = LEVEL_MAX;
    else if (e.key === 'End') next = -LEVEL_MAX;
    else if (e.key === '0') next = 0;
    if (next === null) return;
    e.preventDefault();
    e.stopPropagation();
    setLevel(next);
  });
  renderZoomUI(0);

  function goTo(name) {
    const v = VIEWS[name];
    const cy = state.yaw;
    const ty = cy + Math.atan2(Math.sin(v.yaw - cy), Math.cos(v.yaw - cy)); // shortest way round
    tween = { y0: cy, p0: state.pitch, r0: state.roll, y1: ty, p1: v.pitch, r1: v.roll, t0: performance.now(), dur: reducedMotion ? 350 : 1150 };
    state.tZoom = 1;
    state.vYaw = state.vPitch = 0;
    if (name !== 'home') setAuto(false);
    setActive(name);
  }
  viewBtns.forEach(b => b.addEventListener('click', () => goTo(b.dataset.view)));
  autoBtn.addEventListener('click', () => { setAuto(!autoRotate); if (autoRotate) setActive(null); });

  document.querySelectorAll('.swatches button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.swatches button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    applyPalette(b.dataset.color);
  }));

  const pointers = new Map();
  let dragging = false, moved = false, pinchDist = 0, lastMoveT = 0;
  const pinchDistance = () => {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y) || 1;
  };

  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragging = true; moved = false;
      state.vYaw = state.vPitch = 0;
      canvas.classList.add('dragging');
    } else if (pointers.size === 2) {
      pinchDist = pinchDistance();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;

    if (pointers.size === 1) {
      if (!moved && Math.hypot(dx, dy) > 0.5) {
        moved = true;
        tween = null;
        setAuto(false);   // user started rotating → stop auto-rotation
        setActive(null);
        hideHint();
      }
      if (!moved) return;
      const k = 0.0075;
      const now = performance.now();
      const dt = Math.max((now - lastMoveT) / 1000, 1 / 240);
      lastMoveT = now;
      state.tYaw += dx * k;
      state.tPitch = clamp(state.tPitch + dy * k * 0.85, -PITCH_MAX, PITCH_MAX);
      state.vYaw = state.vYaw * 0.4 + (dx * k / dt) * 0.6;
      state.vPitch = state.vPitch * 0.4 + (dy * k * 0.85 / dt) * 0.6;
    } else if (pointers.size === 2) {
      const d = pinchDistance();
      state.tZoom = clamp(state.tZoom * (pinchDist / d), ZOOM_MIN, ZOOM_MAX);
      pinchDist = d;
      state.vYaw = state.vPitch = 0;
      hideHint();
    }
  });

  const endPointer = (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      state.vYaw = state.vPitch = 0;   // pinch → single finger: no fling
    }
    if (pointers.size === 0) {
      dragging = false;
      canvas.classList.remove('dragging');
      if (performance.now() - lastMoveT > 90) state.vYaw = state.vPitch = 0;
      const vmax = 6;
      state.vYaw = clamp(state.vYaw, -vmax, vmax);
      state.vPitch = clamp(state.vPitch, -vmax, vmax);
    }
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('lostpointercapture', endPointer);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
    state.tZoom = clamp(state.tZoom * Math.exp(clamp(delta, -200, 200) * 0.0012), ZOOM_MIN, ZOOM_MAX);
    hideHint();
  }, { passive: false });

  canvas.addEventListener('dblclick', () => goTo('home'));

  window.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const map = { '1': 'front', '2': 'back', '3': 'side', '0': 'home', 'h': 'home' };
    if (map[e.key]) goTo(map[e.key]);
    else if (e.key === 'r' || e.key === 'R') setAuto(!autoRotate);
    else if (e.key === '+' || e.key === '=') state.tZoom = clamp(state.tZoom * 0.88, ZOOM_MIN, ZOOM_MAX);
    else if (e.key === '-' || e.key === '_') state.tZoom = clamp(state.tZoom / 0.88, ZOOM_MIN, ZOOM_MAX);
  });

  // ───────────────────────── Render loop ─────────────────────────
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const clock = new THREE.Clock();
  let perfFrames = 0, perfTime = 0;

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    if (tween) {
      const p = clamp((performance.now() - tween.t0) / tween.dur, 0, 1);
      const e = ease(p);
      state.yaw = state.tYaw = tween.y0 + (tween.y1 - tween.y0) * e;
      state.pitch = state.tPitch = tween.p0 + (tween.p1 - tween.p0) * e;
      state.roll = tween.r0 + (tween.r1 - tween.r0) * e;
      if (p >= 1) tween = null;
    } else {
      if (!dragging) {
        state.tYaw += state.vYaw * dt;
        state.tPitch = clamp(state.tPitch + state.vPitch * dt, -PITCH_MAX, PITCH_MAX);
        const decay = Math.exp(-dt * 3.2);
        state.vYaw *= decay; state.vPitch *= decay;
        if (autoRotate) state.tYaw += dt * 0.32;
      }
      const f = 1 - Math.exp(-dt * 14);
      state.yaw += (state.tYaw - state.yaw) * f;
      state.pitch += (state.tPitch - state.pitch) * f;
    }
    state.zoom += (state.tZoom - state.zoom) * (1 - Math.exp(-dt * 9));
    if (!zoomDrag) renderZoomUI(levelFromZoom(state.tZoom));   // reflect wheel / pinch / view resets

    // Keep angles bounded without visible jumps.
    if (Math.abs(state.yaw) > 1000 && !tween) {
      const off = Math.round(state.yaw / (Math.PI * 2)) * Math.PI * 2;
      state.yaw -= off; state.tYaw -= off;
    }

    phone.rotation.set(state.pitch, state.yaw, 0, 'XYZ');
    pivot.position.y = reducedMotion ? 0 : Math.sin(t * 0.8) * 1.4;
    pivot.rotation.z = state.roll;

    // Zoommer lighting cross-fade (~0.8 s, matching the backdrop).
    if (themeLight.mix !== themeLight.target) {
      const d = themeLight.target - themeLight.mix;
      themeLight.mix = Math.abs(d) < 0.002 || reducedMotion ? themeLight.target : themeLight.mix + d * (1 - Math.exp(-dt * 4.2));
      const m = themeLight.mix;
      zHemi.intensity = 0.45 * m;
      zWarmL.intensity = 1.7 * m;
      zWarmR.intensity = 1.0 * m;
      rim.intensity = RIM_BASE * (1 - 0.5 * m);
    }
    if (currentTheme === 'zoommer' && !reducedMotion) {
      const f = 1 - Math.exp(-dt * 3);
      const nx = parallax.x + (parallax.tx - parallax.x) * f;
      const ny = parallax.y + (parallax.ty - parallax.y) * f;
      if (Math.abs(nx - parallax.x) + Math.abs(ny - parallax.y) > 0.0005) {
        parallax.x = nx; parallax.y = ny;
        zenvEl.style.setProperty('--px', nx.toFixed(4));
        zenvEl.style.setProperty('--py', ny.toFixed(4));
      }
    }

    const dist = baseDist * state.zoom;
    LOOK_AT.y = -lookFactor * dist;
    const elev = 0.07;
    camera.position.set(LOOK_AT.x, LOOK_AT.y + Math.sin(elev) * dist, Math.cos(elev) * dist);
    camera.lookAt(LOOK_AT);

    updateShadow();
    renderer.render(scene, camera);

    // Adaptive resolution: step the pixel ratio down if the GPU can't keep up.
    perfFrames++; perfTime += dt;
    if (perfFrames >= 90) {
      const avg = perfTime / perfFrames;
      if (avg > 1 / 40 && pixelRatio > 1) {
        pixelRatio = Math.max(1, pixelRatio - 0.25);
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight, false);
      }
      perfFrames = 0; perfTime = 0;
    }
  }

  await step('შეიდერების კომპილაცია…');
  camera.position.set(0, 0, baseDist);
  camera.lookAt(LOOK_AT);
  try { await renderer.compileAsync(scene, camera); } catch (e) { /* falls back to compile on first render */ }

  renderer.setAnimationLoop(frame);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.__READY__ = true;
    clearTimeout(window.__loadTimer);
    loaderEl.classList.add('done');
    setTimeout(() => { loaderEl.style.display = 'none'; }, 800);
  }));
}
</script>
</body>
</html>
